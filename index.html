    <style>
        body {
            background-color: #070c14;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(12, 141, 233, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(54, 168, 247, 0.12) 0%, transparent 45%),

            background: rgba(22, 27, 34, 0.9);
            border: 1px solid rgba(56, 139, 253, 0.3);
            border-radius: 0.85rem;
            position: relative;
            overflow: hidden;
        }

        }

        .crystal-glow-amber {
            text-shadow: 0 0 14px rgba(245, 158, 11, 0.7);
        }

        canvas {
            touch-action: none;
            cursor: crosshair;

            width: 8px;

            background: #0d1117;

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Configuration for Live Multi-Device Synchronization
        const firebaseConfig = {
            databaseURL: "https://quarts-doodles-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getDatabase(app);
        window.dbRef = ref;
        window.dbSet = set;
        window.dbOnValue = onValue;
        window.dbUpdate = update;
    </script>

const DEFAULT_PROMPTS = [
    "Coffee Mug", "Sunglasses", "Bicycle", "Headphones", "Eiffel Tower",
    "Pizza Slice", "Running Shoe", "Wristwatch", "Smartphone"
];

const ITEM_CATEGORIES = [
    "Coffee Mug", "Sunglasses", "Bicycle", "Headphones", "Eiffel Tower",
    "Pizza Slice", "Running Shoe", "Wristwatch", "Smartphone", "Laptop",
    "Guitar", "Camera", "Basketball", "Backpack", "Desk Lamp",
    "Umbrella", "Water Bottle", "Gamepad", "Alarm Clock", "Headset"
];

// Master Prompt generator function
function generateRandomPromptsList() {
    const shuffled = [...ITEM_CATEGORIES].sort(() => 0.5 - Math.random());
    return shuffled.slice(0, 9);
}

// Render Master Prompt Box in GM Panel
function renderGmMasterPrompts(prompts) {
    const container = document.getElementById("gmMasterPromptsList");
    if (!container) return;
    
    container.innerHTML = prompts.map((prompt, index) => `
        <div class="flex items-center gap-2 bg-slate-900/70 p-2 rounded-lg border border-indigo-500/20">
            <span class="w-6 h-6 rounded-full bg-indigo-600/60 text-indigo-200 text-xs font-bold flex items-center justify-center">
                ${index + 1}
            </span>
            <span class="font-semibold text-slate-100 truncate">${prompt}</span>
        </div>
    `).join('');
}

// Update GM Card rendering to ensure prompt title is clearly displayed
function renderGmGrid(prompts, strokesData) {
    const grid = document.getElementById("gmCardsGrid");
    if (!grid) return;

    grid.innerHTML = prompts.map((prompt, idx) => {
        const itemNum = idx + 1;
        return `
            <div class="glass-card p-4 flex flex-col space-y-3 border-indigo-500/20 hover:border-indigo-500/40 transition-all">
                <div class="flex justify-between items-center bg-slate-900/60 p-2 rounded-lg border border-slate-700/50">
                    <span class="badge badge-purple text-xs font-bold">Item #${itemNum}</span>
                    <span class="text-sm font-bold text-amber-300 truncate max-w-[180px]"><i class="fas fa-pencil-alt mr-1"></i>${prompt}</span>
                </div>

                <div class="canvas-container relative rounded-lg border border-slate-700/80 bg-slate-950 overflow-hidden">
                    <canvas id="gmCanvas_${itemNum}" class="w-full h-48 block cursor-default"></canvas>
                </div>

                <div class="flex items-center justify-between text-xs text-slate-400 px-1">
                    <span><i class="fas fa-eye text-indigo-400 mr-1"></i> Live Mirror</span>
                    <span id="strokeCount_${itemNum}">${(strokesData && strokesData[itemNum]) ? strokesData[itemNum].length : 0} strokes</span>
                </div>
            </div>
        `;
    }).join('');

    // Attach/Redraw mirror canvases
    prompts.forEach((_, idx) => {
        const itemNum = idx + 1;
        const canvas = document.getElementById(`gmCanvas_${itemNum}`);
        if (canvas && strokesData && strokesData[itemNum]) {
            drawStrokesToCanvas(canvas, strokesData[itemNum]);
        }
    });
}

document.getElementById("btnRegeneratePrompts")?.addEventListener("click", async () => {
    const newPrompts = generateRandomPromptsList();
    if (db && currentRoomCode) {
        try {
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomCode);
            await updateDoc(roomRef, { prompts: newPrompts });
        } catch (err) {
            console.error("Error updating prompts in database:", err);
        }
    } else {
        renderGmMasterPrompts(newPrompts);
        renderGmGrid(newPrompts, currentStrokes);
    }
});

// Update Firestore listener to render prompts dynamically in GM view
function syncRoomState(roomData) {
    const prompts = roomData.prompts || DEFAULT_PROMPTS;
    renderGmMasterPrompts(prompts);
    renderGmGrid(prompts, roomData.strokes || {});
}

        function selectRole(role) {
            userRole = role;
            roomCode = document.getElementById('roomInput').value.trim().toUpperCase() || 'QUARTS-1';
            
            document.getElementById('roleModal').classList.add('hidden');
            
            // Update Navigation Badges
            document.getElementById('activeRoleBadge').innerText = `Role: ${role === 'gm' ? 'Game Master' : 'Player'}`;
            document.getElementById('activeRoomBadge').innerText = `Room: ${roomCode}`;

            // Adjust Role Views
            if (userRole === 'gm') {
                document.getElementById('headerRoleTitle').innerText = "Game Master View";
                document.getElementById('headerRoleSubtitle').innerText = "Viewing secret prompts, live player canvas & master clock";
                document.getElementById('playerDrawingTools').classList.add('hidden');
                document.getElementById('gmDrawNotice').classList.remove('hidden');
                document.getElementById('shufflePromptsBtn').classList.remove('hidden');
                document.getElementById('promptListTitle').innerText = "Game Master Secret Answer Key (9 Items):";
            } else {
                document.getElementById('headerRoleTitle').innerText = "Player Drawing Arena";
                document.getElementById('headerRoleSubtitle').innerText = "Draw called-out items in 30 seconds • Synced live to Game Master";
                document.getElementById('playerDrawingTools').classList.remove('hidden');
                document.getElementById('gmDrawNotice').classList.add('hidden');
                document.getElementById('shufflePromptsBtn').classList.add('hidden');
                document.getElementById('promptListTitle').innerText = "Sprint Prompts (Listen to GM Callout):";
            }

            connectFirebaseSession();
        }

        function connectFirebaseSession() {
            if (!window.db) return;

            roomRef = window.dbRef(window.db, `rooms/${roomCode}`);

            // Listen for changes in real time
            window.dbOnValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                
                if (!data) {
                    // Seed initial room data if room doesn't exist
                    if (userRole === 'gm') {
                        triggerNewPrompts();
                    }
                    return;
                }

                // 1. Sync 9 Prompts
                if (data.prompts) {
                    currentPrompts = data.prompts;
                    renderPrompts();
                    renderApprovalCheckboxes(data.approved || []);
                }

                // 2. Sync Canvas Strokes (GM draws remote stroke)
                if (data.lastStroke && userRole === 'gm') {
                    drawRemoteStroke(data.lastStroke);
                }

                if (data.clearCanvasSignal && userRole === 'gm') {
                    clearLocalCanvas();
                }

                // 3. Sync Clock State across both screens
                if (data.timerState) {
                    syncTimerState(data.timerState);
                }
            });
        }

        // --- Canvas Drawing Logic & Sync ---
        function setBrushColor(color) {
            currentColor = color;
            ctx.strokeStyle = currentColor;
        }

        function setBrushSize(size) {
            currentLineWidth = size;
            ctx.lineWidth = currentLineWidth;
        }

        function clearLocalCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function triggerClearCanvas() {
            clearLocalCanvas();
            if (userRole === 'player' && roomRef) {
                window.dbUpdate(roomRef, { clearCanvasSignal: Date.now() });
            }
        }

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) / rect.width,  // Normalized coordinates (0 to 1)
                y: (e.clientY - rect.top) / rect.height
            };
        }

        function startDrawing(e) {
            if (userRole !== 'player') return;
            isDrawing = true;
            const coords = getCanvasCoords(e);
            lastX = coords.x;
            lastY = coords.y;
        }

        function draw(e) {
            if (!isDrawing || userRole !== 'player') return;
            const coords = getCanvasCoords(e);

            // Draw on Player's local canvas
            drawSegment(lastX, lastY, coords.x, coords.y, currentColor, currentLineWidth);

            // Send stroke coordinates to Game Master via Firebase
            if (roomRef) {
                window.dbUpdate(roomRef, {
                    lastStroke: {
                        x1: lastX,
                        y1: lastY,
                        x2: coords.x,
                        y2: coords.y,
                        color: currentColor,
                        width: currentLineWidth,
                        ts: Date.now()
                    }
                });
            }

            lastX = coords.x;
            lastY = coords.y;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function handleTouchStart(e) {
            e.preventDefault();
            if (e.touches.length > 0) startDrawing(e.touches[0]);
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (e.touches.length > 0) draw(e.touches[0]);
        }

        function drawSegment(x1, y1, x2, y2, color, width) {
            const absX1 = x1 * canvas.width;
            const absY1 = y1 * canvas.height;
            const absX2 = x2 * canvas.width;
            const absY2 = y2 * canvas.height;

            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.beginPath();
            ctx.moveTo(absX1, absY1);
            ctx.lineTo(absX2, absY2);
            ctx.stroke();
        }

        function drawRemoteStroke(stroke) {
            drawSegment(stroke.x1, stroke.y1, stroke.x2, stroke.y2, stroke.color, stroke.width);
        }

        // --- Synchronized Clock Algorithm ---
        function triggerStartTimer() {
            if (!roomRef) return;
            window.dbUpdate(roomRef, {
                timerState: {
                    status: 'running',
                    startTime: Date.now(),
                    secondsLeft: timerSeconds
                }
            });
        }

        function triggerPauseTimer() {
            if (!roomRef) return;
            window.dbUpdate(roomRef, {
                timerState: {
                    status: 'paused',
                    secondsLeft: timerSeconds
                }
            });
        }

        function triggerResetTimer() {
            if (!roomRef) return;
            window.dbUpdate(roomRef, {
                timerState: {
                    status: 'reset',
                    secondsLeft: 30.0
                }
            });
        }

        function syncTimerState(state) {
            clearInterval(timerInterval);

            if (state.status === 'running') {
                const startTime = state.startTime;
                const baseSeconds = state.secondsLeft;

                document.getElementById('startBtn').disabled = true;
                document.getElementById('pauseBtn').disabled = false;
                hideTimesUpOverlay();

                timerInterval = setInterval(() => {
                    const elapsed = (Date.now() - startTime) / 1000;
                    timerSeconds = Math.max(0, baseSeconds - elapsed);
                    updateTimerDisplay();

                    if (timerSeconds <= 0) {
                        clearInterval(timerInterval);
                        showTimesUpOverlay();
                        document.getElementById('startBtn').disabled = false;
                        document.getElementById('pauseBtn').disabled = true;
                    }
                }, 50);
            } else if (state.status === 'paused') {
                timerSeconds = state.secondsLeft;
                updateTimerDisplay();
                document.getElementById('startBtn').disabled = false;
                document.getElementById('pauseBtn').disabled = true;
            } else if (state.status === 'reset') {
                timerSeconds = 30.0;
                updateTimerDisplay();
                hideTimesUpOverlay();
                document.getElementById('startBtn').disabled = false;
                document.getElementById('pauseBtn').disabled = true;
            }
        }

        function updateTimerDisplay() {
            const timerEl = document.getElementById('timerDisplay');
            timerEl.innerText = timerSeconds.toFixed(1) + 's';

            if (timerSeconds <= 5.0 && timerSeconds > 0) {
                timerEl.classList.remove('text-cyan-300');
                timerEl.classList.add('text-rose-500', 'animate-pulse');
            } else {
                timerEl.classList.remove('text-rose-500', 'animate-pulse');
                timerEl.classList.add('text-cyan-300');
            }
        }

        function showTimesUpOverlay() {
            document.getElementById('timesUpOverlay').classList.remove('hidden');
            document.getElementById('timesUpOverlay').classList.add('flex');
        }

        function hideTimesUpOverlay() {
            document.getElementById('timesUpOverlay').classList.add('hidden');
            document.getElementById('timesUpOverlay').classList.remove('flex');
        }

        // --- Prompts & Score Calculation ---
        function triggerNewPrompts() {
            const shuffled = [...defaultPromptList].sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 9);
            
            if (roomRef) {
                window.dbUpdate(roomRef, {
                    prompts: selected,
                    approved: [false, false, false, false, false, false, false, false, false]
                });
            } else {
                currentPrompts = selected;
                renderPrompts();
            }
        }

        function renderPrompts() {
            const container = document.getElementById('promptsContainer');
            container.innerHTML = '';

            currentPrompts.forEach((item, index) => {
                const badge = document.createElement('div');
                
                if (userRole === 'gm') {
                    // Game Master Secret View (Clear Items Unmasked)
                    badge.className = 'bg-amber-950/80 border border-amber-500/60 p-2 rounded-lg text-center shadow-lg';
                    badge.innerHTML = `
                        <div class="text-[9px] font-mono text-amber-300 font-bold uppercase">Item #${index + 1}</div>
                        <div class="text-xs font-black text-white truncate crystal-glow-amber">${item}</div>
                    `;
                } else {
                    // Player View (Masked Items)
                    badge.className = 'bg-gh-bg border border-quartz-500/30 p-2 rounded-lg text-center shadow';
                    badge.innerHTML = `
                        <div class="text-[9px] font-mono text-quartz-400 font-bold">Slot #${index + 1}</div>
                        <div class="text-[11px] font-semibold text-slate-400 flex items-center justify-center gap-1">
                            <i class="fa-solid fa-lock text-quartz-400/60 text-[10px]"></i>
                            <span>GM Callout</span>
                        </div>
                    `;
                }

                container.appendChild(badge);
            });
        }

        function renderApprovalCheckboxes(approvedList) {
            const container = document.getElementById('approvalCheckboxes');
            container.innerHTML = '';
            score = 0;

            currentPrompts.forEach((item, index) => {
                const isApproved = approvedList[index] || false;
                if (isApproved) score++;

                const btn = document.createElement('button');
                btn.id = `approve-btn-${index}`;
                btn.disabled = userRole !== 'gm'; // Game Master controls score approval
                btn.onclick = () => toggleApproval(index, approvedList);
                
                if (isApproved) {
                    btn.className = 'bg-quartz-900 border border-cyan-400 p-2 rounded-lg flex flex-col items-center justify-center gap-1 text-cyan-300 shadow-md';
                    btn.innerHTML = `<i class="fa-solid fa-circle-check text-base text-cyan-400"></i><span class="text-[10px] font-mono font-bold truncate max-w-full">${index + 1}. ${item}</span>`;
                } else {
                    btn.className = 'bg-gh-card border border-gh-border hover:border-quartz-400 p-2 rounded-lg flex flex-col items-center justify-center gap-1 text-slate-400 transition';
                    btn.innerHTML = `<i class="fa-regular fa-circle-check text-base"></i><span class="text-[10px] font-mono font-bold truncate max-w-full">${index + 1}. ${item}</span>`;
                }

                container.appendChild(btn);
            });

            updateScoreDisplay();
        }

        function toggleApproval(index, approvedList) {
            if (userRole !== 'gm' || !roomRef) return;
            const updated = [...approvedList];
            updated[index] = !updated[index];

            window.dbUpdate(roomRef, { approved: updated });
        }

        function updateScoreDisplay() {
            document.getElementById('scoreDisplay').innerText = `${score} / 9`;

            const rewardTitle = document.getElementById('rewardTitle');
            const rewardDesc = document.getElementById('rewardDesc');
            const rewardIcon = document.getElementById('rewardIcon');
            const rewardBanner = document.getElementById('rewardBanner');

            if (score === 9) {
                rewardTitle.innerText = "FULL SWEEP! 2 Giveaways Awarded!";
                rewardDesc.innerText = "All 9 drawings approved! Player wins two (2) giveaways + QuARTS sticker!";
                rewardIcon.className = "fa-solid fa-crown text-3xl text-amber-300 animate-bounce";
                rewardBanner.className = "p-4 rounded-xl bg-gradient-to-r from-quartz-900 via-cyan-950 to-quartz-900 border-2 border-cyan-400 shadow-lg flex items-center justify-between";
            } else if (score >= 5) {
                rewardTitle.innerText = "1 Giveaway Awarded!";
                rewardDesc.innerText = `Minimum threshold met (${score}/9)! Player receives 1 giveaway + QuARTS sticker!`;
                rewardIcon.className = "fa-solid fa-trophy text-3xl text-amber-400";
                rewardBanner.className = "p-4 rounded-xl bg-quartz-900/80 border border-quartz-400 flex items-center justify-between";
            } else {
                rewardTitle.innerText = "Select approved items above";
                rewardDesc.innerText = "5 points = 1 giveaway • 9 points = Full Sweep (2 giveaways)";
                rewardIcon.className = "fa-solid fa-award text-2xl text-slate-500";
                rewardBanner.className = "p-4 rounded-xl bg-gh-card border border-gh-border flex items-center justify-between";
            }
        }
    </script>
